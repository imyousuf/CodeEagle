name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be a release whose binaries are built with a Go toolchain at
          # least as new as go-version above, or it cannot read the standard
          # library's export data. Keep in sync with GOLANGCI_LINT_VERSION in
          # the Makefile. v2.13.2 is built with Go 1.27.
          version: v2.13.2

      - name: Test
        run: make test

      - name: Build
        run: make build
