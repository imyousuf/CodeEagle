name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pull request is checked out as a detached merge commit with no
      # local main, but internal/gitutil's tests read this checkout and
      # expect what a developer has: a named branch and a local main.
      - name: Check out the pull request as a branch
        if: github.event_name == 'pull_request'
        run: |
          git checkout -B "$HEAD_REF"
          git branch -f main origin/main
        env:
          HEAD_REF: ${{ github.head_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be a release built with a Go toolchain at least as new as
          # go-version above, and depending on an x/tools that can read the
          # standard library's export data. The second can break on a patch
          # release: Go 1.27.2 moved export data to version 5, which v2.13.2's
          # x/tools rejects however it is built. Keep in sync with
          # GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.15.0
          # pkg/jev is a separate module, so the repository root's ./...
          # stops at its directory. Named explicitly, or it is never linted.
          # Keep in sync with PACKAGES in the Makefile.
          args: ./... ./pkg/jev/...

      - name: Test
        run: make test

      - name: Build
        run: make build
